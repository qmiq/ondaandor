<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1C1A17">
    <title>ONDA ANDOR SLEEP MODE — Личный кабинет</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎲%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/profile.js"></script>
  </head>
  <body>
    <div data-header></div>
    <main class="container section">
      <div class="profile-top">
        <div>
          <span class="eyebrow">Твоё пространство клуба</span>
          <h1 id="welcome">Личный кабинет</h1>
        </div>
        <a class="button button-accent" href="booking.html">Новая бронь →</a>
      </div>

      <section class="section" aria-labelledby="bookings-title">
        <div class="section-heading">
          <h2 id="bookings-title">Мои бронирования</h2>
        </div>
        <div class="booking-list" id="my-bookings"></div>
      </section>

      <section aria-labelledby="profile-title">
        <div class="section-heading">
          <h2 id="profile-title">Данные профиля</h2>
        </div>
        <form class="form-card form-grid" id="profile-form">
          <div class="field">
            <label for="profile-name">Имя</label>
            <input
              id="profile-name"
              name="name"
              required
            >
          </div>
          <div class="field">
            <label for="profile-phone">Телефон</label>
            <input
              id="profile-phone"
              name="phone"
              type="tel"
              placeholder="+7 900 123-45-67"
            >
          </div>
          <div class="form-wide">
            <button class="button button-accent" type="submit">Сохранить изменения</button>
            <button
              class="button button-ghost"
              type="button"
              data-profile-logout
            >Выйти</button>
          </div>
        </form>
      </section>
    </main>
    <div data-footer></div>
  </body>
</html>

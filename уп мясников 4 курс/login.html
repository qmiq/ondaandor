<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1C1A17">
    <title>ONDA ANDOR SLEEP MODE — Вход</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎲%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/auth-pages.js"></script>
  </head>
  <body>
    <div data-header></div>
    <main class="auth-wrap">
      <span class="eyebrow">Рады снова видеть</span>
      <h1>Войти в клуб</h1>
      <p class="muted">Войдите, чтобы управлять бронированиями.</p>
      <form
        class="form-card form-grid"
        id="login-form"
        novalidate
      >
        <div class="field form-wide">
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            required
          >
        </div>
        <div class="field form-wide">
          <label for="password">Пароль</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          >
        </div>
        <div class="form-wide">
          <button class="button button-accent" type="submit">Войти →</button>
        </div>
      </form>
      <p class="auth-links">Нет аккаунта? <a href="register.html">Зарегистрироваться</a></p>
    </main>
    <div data-footer></div>
  </body>
</html>

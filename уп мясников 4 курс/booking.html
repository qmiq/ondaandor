<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1C1A17">
    <title>ONDA ANDOR SLEEP MODE — Бронирование стола</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎲%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/booking.js"></script>
  </head>
  <body>
    <div data-header></div>
    <main class="booking-wrap">
      <span class="eyebrow">До встречи за столом</span>
      <h1>Бронирование стола</h1>
      <p class="muted">Заполните форму — мы подготовим место и выбранную игру.</p>

      <form
        class="form-card form-grid"
        id="booking-form"
        novalidate
      >
        <div class="field">
          <label for="name">Имя *</label>
          <input
            id="name"
            name="name"
            autocomplete="name"
            required
            aria-describedby="name-error"
          >
          <span class="field-error" id="name-error"></span>
        </div>
        <div class="field">
          <label for="phone">Телефон *</label>
          <input
            id="phone"
            name="phone"
            type="tel"
            placeholder="+7 (900) 123-45-67"
            autocomplete="tel"
            required
            aria-describedby="phone-error"
          >
          <span class="field-error" id="phone-error"></span>
        </div>
        <div class="field">
          <label for="email">Email *</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            required
            aria-describedby="email-error"
          >
          <span class="field-error" id="email-error"></span>
        </div>
        <div class="field">
          <label for="date">Дата *</label>
          <input
            id="date"
            name="date"
            type="date"
            required
            aria-describedby="date-error"
          >
          <span class="field-error" id="date-error"></span>
        </div>
        <div class="field">
          <label for="time">Время *</label>
          <select
            id="time"
            name="time"
            required
            aria-describedby="time-error"
          >
            <option value="">Выберите время</option>
            <option value="12:00">12:00</option>
            <option value="14:00">14:00</option>
            <option value="16:00">16:00</option>
            <option value="18:00">18:00</option>
            <option value="20:00">20:00</option>
          </select>
          <span class="field-error" id="time-error"></span>
        </div>
        <div class="field">
          <label for="people">Количество человек *</label>
          <input
            id="people"
            name="people"
            type="number"
            min="1"
            max="12"
            value="2"
            required
            aria-describedby="people-error"
          >
          <span class="field-error" id="people-error"></span>
        </div>
        <div class="field form-wide">
          <label for="game">Игра *</label>
          <select
            id="game"
            name="game"
            required
            aria-describedby="game-error"
          >
            <option value="">Выберите игру</option>
          </select>
          <span class="field-error" id="game-error"></span>
        </div>
        <div class="field form-wide">
          <label for="comment">Комментарий</label>
          <textarea
            id="comment"
            name="comment"
            placeholder="Пожелания к бронированию"
          ></textarea>
        </div>
        <div class="form-wide">
          <button class="button button-accent" type="submit">Забронировать стол →</button>
          <p class="form-note">Поля со звёздочкой обязательны.</p>
          <div id="booking-result" aria-live="polite"></div>
        </div>
      </form>
    </main>
    <div data-footer></div>
  </body>
</html>
